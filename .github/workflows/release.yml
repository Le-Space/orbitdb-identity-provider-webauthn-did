name: Release

# Publishing moves from a maintainer's laptop into CI.
#
# Until now `preversion` and `prepublishOnly` ran `test:ci`, and the release
# went out from wherever `npm publish` was typed. Here the full suite in
# ci.yml has to pass before anything is published.
#
# Two ways in:
#   - push a tag `v1.2.3`  -> full suite, then publish
#   - run manually          -> mode: check (default) verifies without publishing
#
# Two packages come out of this repository: the provider at the root, and
# @le-space/passkey-wallet in packages/passkey-wallet. A tag says which one it
# releases — `v1.2.3` the provider, `passkey-wallet-v1.2.3` the wallet — and a
# manual run says it in `package`. The test gate is the same full suite either
# way.
#
# Auth defaults to npm Trusted Publishing (OIDC), which needs no token. It has
# to be configured once on npmjs.com for the package:
#   Package settings -> Trusted Publisher -> GitHub Actions
#     repository:      Le-Space/orbitdb-identity-provider-webauthn-did
#     workflow:        release.yml
# Set auth: token to fall back to the NPM_TOKEN secret instead. Note npm is
# restricting classic 2FA-bypassing tokens for direct publishing, so OIDC is
# the durable option. A package's very first version has to go out with
# auth: token: the trusted publisher is configured in the package's settings
# on npmjs.com, and those exist only once the package does.

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'which package to release'
        type: choice
        options: [provider, passkey-wallet]
        default: provider
      mode:
        description: 'check = verify only, publish = run tests and publish'
        type: choice
        options: [check, publish]
        default: check
      auth:
        description: 'npm authentication method'
        type: choice
        options: [oidc, token]
        default: oidc
  push:
    tags: ['v*', 'passkey-wallet-v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  target:
    name: Which package
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.pick.outputs.dir }}
      name: ${{ steps.pick.outputs.name }}
      tag_version: ${{ steps.pick.outputs.tag_version }}
    steps:
      - uses: actions/checkout@v7

      - id: pick
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          # A tag names its package by its prefix; a manual run by `package`.
          case "$GITHUB_EVENT_NAME:$GITHUB_REF_NAME:$INPUT_PACKAGE" in
            push:passkey-wallet-v*) dir=packages/passkey-wallet; tag="${GITHUB_REF_NAME#passkey-wallet-v}" ;;
            push:v*)                dir=.;                       tag="${GITHUB_REF_NAME#v}" ;;
            *:passkey-wallet)       dir=packages/passkey-wallet; tag= ;;
            *)                      dir=.;                       tag= ;;
          esac
          name="$(node -p "require('./$dir/package.json').name")"
          echo "releasing $name from $dir"
          {
            echo "dir=$dir"
            echo "name=$name"
            echo "tag_version=$tag"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify package and auth
    needs: [target]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tag and package.json version must agree
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: ${{ needs.target.outputs.dir }}
        env:
          TAG: ${{ needs.target.outputs.tag_version }}
        run: |
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Package contents
        working-directory: ${{ needs.target.outputs.dir }}
        run: npm pack --dry-run

      - name: Check npm token
        if: inputs.auth == 'token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry https://registry.npmjs.org

  test:
    name: Full test suite
    if: github.event_name == 'push' || inputs.mode == 'publish'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: [target, verify, test]
    if: github.event_name == 'push' || inputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      # Deliberately no registry-url here. It makes setup-node write
      # `_authToken=${NODE_AUTH_TOKEN}` into .npmrc, and an empty value can make
      # npm attempt token auth and fail instead of falling back to trusted
      # publishing. registry.npmjs.org is the default anyway.
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Trusted publishing needs a recent npm CLI; the one bundled with Node 22
      # predates it.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      # Reports the claims npm matches a trusted publisher against, so a
      # mismatch on npmjs.com can be read off directly. Non-fatal: it is
      # diagnostics, not a gate.
      - name: OIDC claims
        if: inputs.auth != 'token'
        continue-on-error: true
        run: |
          token=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).value")
          node -e "
            const c = JSON.parse(Buffer.from('$token'.split('.')[1], 'base64url'));
            console.log('The trusted publisher on npmjs.com must match:');
            console.log('  repository:   ' + c.repository);
            console.log('  workflow_ref: ' + c.workflow_ref);
            console.log('  environment:  ' + (c.environment ?? '(none)'));
          "

      # --ignore-scripts: prepublishOnly would re-run the gate the `test` job
      # just cleared.
      #
      # --loglevel=verbose: npm reports a bare ENEEDAUTH when trusted publishing
      # does not engage, which does not say whether it tried. The verbose log
      # shows whether it attempts the OIDC exchange at all.
      - name: Publish
        working-directory: ${{ needs.target.outputs.dir }}
        run: |
          publish() { npm publish --access public --provenance --ignore-scripts "$@"; }

          if [ "${{ inputs.auth }}" = "token" ]; then
            echo "authenticating with NPM_TOKEN (explicitly requested)"
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
            publish
            exit $?
          fi

          # A tag push cannot pass inputs, so it lands here. Try trusted
          # publishing first — it needs no long-lived secret — and fall back to
          # NPM_TOKEN if the registry has no trusted publisher for this package.
          # npm publish is atomic, so a failed attempt has published nothing and
          # retrying is safe.
          echo "attempting trusted publishing (OIDC)"
          if publish --loglevel=verbose; then
            exit 0
          fi

          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Trusted publishing failed and no NPM_TOKEN is configured."
            exit 1
          fi

          echo "::warning::Trusted publishing did not succeed; falling back to NPM_TOKEN. See the verbose log above for why."
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  notify:
    name: Report outcome
    needs: [target, publish]
    if: always() && (github.event_name == 'push' || inputs.mode == 'publish')
    runs-on: ubuntu-latest
    steps:
      - name: Published
        if: needs.publish.result == 'success'
        run: |
          echo "### Published :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ needs.target.outputs.name }}\` at \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Not published
        if: needs.publish.result != 'success'
        run: |
          echo "### Publish did not run to completion" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "publish job: \`${{ needs.publish.result }}\` — see the job logs." >> "$GITHUB_STEP_SUMMARY"
          exit 1
