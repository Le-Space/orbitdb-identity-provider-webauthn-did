name: Token check (temporary)
on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Shape of the secret (no value printed)
        env:
          T: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "length: ${#T}"
          case "$T" in
            npm_*)  echo "prefix: npm_  (classic automation/publish token)" ;;
            npms_*) echo "prefix: npms_ (granular access token)" ;;
            "")     echo "prefix: EMPTY — secret not set" ;;
            *)      echo "prefix: does NOT start with npm_ or npms_ — likely malformed (quotes? NPM_TOKEN= prefix? newline?)" ;;
          esac
          printf 'leading/trailing whitespace: '
          if [ "$T" != "$(printf '%s' "$T" | tr -d '[:space:]')" ]; then echo YES; else echo no; fi

      - name: Registry reachable (no auth)
        run: npm ping --registry https://registry.npmjs.org

      - name: whoami (authenticated)
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry https://registry.npmjs.org

      - name: access get status (authenticated, package-scoped)
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm access get status @le-space/orbitdb-identity-provider-webauthn-did

      - name: token list (classic tokens only)
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm token list
